[project]
name = "ledgerbench"
version = "0.1.0"
description = "Java vs .NET Ledgerline benchmark runner, validation, and analysis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx~=0.28",   # /runtime-stats + /healthz polling, equivalence HTTP
    "pydantic~=2.11", # manifest + workload + run-ledger schemas (validation, JSON)
    "pyyaml~=6.0",   # read workload.yaml / slo.yaml
    "typer~=0.15",   # CLI for all entry points (subcommands)
    "rich~=13.9",    # console tables/progress (CLI output)
    # The measured run itself needs numpy: run_fit/run_soak call analysis.knee /
    # analysis.pava / analysis.mann_kendall (stationarity gate, knee fit). Core dep
    # so `uv run ledgerbench run-all` can never crash at the fit phase mid-run.
    "numpy~=2.2",
    # `ledgerbench analyze` imports these lazily (paired stats, frames). They are
    # core deps, not an extra: a host that can run a multi-night measured tier
    # always wants to analyze it, and `uv sync` + `make analyze` used to end in
    # ModuleNotFoundError.
    "scipy~=1.15",
    "pandas~=2.2",
]

[project.scripts]
ledgerbench = "ledgerbench.__main__:main"

[dependency-groups]
dev = [
    "pytest~=8.3",
    "ruff~=0.9",   # `make lint`
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Three packages in one uv project (one lockfile, one venv): the runner
# `ledgerbench` plus the `validation` and `analysis` siblings.
packages = ["ledgerbench", "validation", "analysis"]

[tool.ruff]
# The formatter is deliberately NOT wired into `make fmt`: this codebase aligns
# inline comments in dataclass and constant blocks on purpose, and `ruff format`
# collapses that alignment across ~5k lines. `make lint` runs the linter only.
line-length = 100

[tool.ruff.lint]
# Pyflakes + the pycodestyle errors that catch real mistakes. Deliberately not
# the full rule set: this is a lint gate, not a style rewrite.
select = ["E4", "E7", "E9", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# Imports follow a skip guard that must run before the scientific stack is touched.
"tests/test_analyze.py" = ["E402"]
# matplotlib.use("Agg") must precede the pyplot imports.
"figures.py" = ["E402"]

[tool.pytest.ini_options]
# Runner-core tests live in tests/; validation/analysis tests live next to
# their code (validation/tests, analysis/tests) so each package is self-contained.
testpaths = ["tests", "validation/tests", "analysis/tests"]
markers = [
    "docker: tests that need a running Docker daemon (skipped without it)",
]
