# spec/postgres/postgresql.conf — PG 18.4, Ledgerline benchmark.
# Three-way provenance (see README.md in this directory):
#   [INHERITED]    verbatim from the prior post's tuned config
#   [RESCALED]     re-derived for THIS 8GB/3-core PG container (the post tuned
#                  for PG owning the whole 62GB/16-core box)
#   [PG18-DEFAULT] PostgreSQL 18 defaults, explicitly NOT inherited; shown
#                  commented for disclosure only.

# ---- [INHERITED] durability / WAL / planner / timeouts -----------------------
fsync = on                                   # [INHERITED] never off
synchronous_commit = on                      # [INHERITED] the prior post is the argument; never a lever
wal_buffers = 64MB                           # [INHERITED]
max_wal_size = 4GB                           # [INHERITED]
checkpoint_completion_target = 0.9           # [INHERITED]
effective_io_concurrency = 200               # [INHERITED] NVMe
random_page_cost = 1.1                       # [INHERITED] NVMe
huge_pages = try                             # [INHERITED]
statement_timeout = 5s                       # [INHERITED] production-realistic
lock_timeout = 1s                            # [INHERITED]
idle_in_transaction_session_timeout = 10s    # [INHERITED]

# ---- [RESCALED] memory-class settings for the 8GB/3-core container -----------
shared_buffers = 2GB                         # [RESCALED] ~25% of 8GB (post: 15GB of 62GB)
effective_cache_size = 6GB                   # [RESCALED] ~75% of 8GB (post: 46GB)
work_mem = 16MB                              # [RESCALED] (post: 64MB at 300 conns; we run <=24)
max_connections = 100                        # [RESCALED] (post: 300) >> DB_POOL_MAX(24); coordinated with pool parity

# ---- [PG18-DEFAULT] explicitly NOT inherited (not disclosed in the post) -----
# io_method = worker                # PG 18 AIO default; left default, disclosed.
# io_workers = 3                    # PG 18 default.
# checkpoint_timeout = 5min         # default.
# min_wal_size = 80MB               # default.
# wal_compression = off             # default.
# autovacuum = on                   # default thresholds.
# bgwriter_* = defaults.
# (Commented on purpose: uncommenting would be a change. README explains.)

listen_addresses = '*'
